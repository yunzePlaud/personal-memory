[project]
name = "personal-memory"
version = "0.1.0"
description = "Personal Memory Infrastructure: portable, agent-native long-term memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
semantic = ["fastembed==0.9.1"]

[project.scripts]
pmi = "pmi.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or a downloaded embedding model"]
addopts = "-m 'not slow'"
